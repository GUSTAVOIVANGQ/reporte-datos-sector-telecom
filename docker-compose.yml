services:
  ui:
    build:
      context: .
      args:
        PYTHON_VERSION: "3.9.25"
        RENV_VERSION: "1.1.4"
    image: reporte-telecom:3.6.7
    restart: unless-stopped
    ports:
      - "3838:3838"
    environment:
      REPORTE_SERVICIO: ui
      REPORTE_PERMITIR_RED: "true"
      REPORTE_ALERT_WEBHOOK_URL: "${REPORTE_ALERT_WEBHOOK_URL:-}"
    volumes:
      - ./entrada/datos_bit:/app/entrada/datos_bit
      - ./salidas:/app/salidas
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3838/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  api:
    build:
      context: .
      args:
        PYTHON_VERSION: "3.9.25"
        RENV_VERSION: "1.1.4"
    image: reporte-telecom:3.6.7
    restart: unless-stopped
    command: ["Rscript", "api/run_api.R", "--host=0.0.0.0", "--port=8000"]
    ports:
      - "8000:8000"
    environment:
      REPORTE_SERVICIO: api
      REPORTE_ALERT_WEBHOOK_URL: "${REPORTE_ALERT_WEBHOOK_URL:-}"
    volumes:
      - ./entrada/datos_bit:/app/entrada/datos_bit
      - ./salidas:/app/salidas
    depends_on:
      ui:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/salud"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
